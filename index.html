<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Rachel Tong</title>

    <link rel="icon" href="images/websitelogo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Carrois+Gothic+SC&family=Reenie+Beanie&display=swap" rel="stylesheet">

    <!-- React 18 + Babel standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

        :root {

        .climate { font-family: 'Climate Crisis', sans-serif; }
        .beanie  { font-family: 'Reenie Beanie', cursive; }
        .mono    { font-family: 'Carrois Gothic SC', sans-serif; }

        a { color: inherit; }

        /* hide scrollbar */
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="home.jsx" data-type="module"></script>
